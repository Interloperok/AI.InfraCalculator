services:
  # Backend API сервис
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-server-calculator-backend
    # Loopback only: the public entry point is the host's nginx on 443
    # (calc.aicolab.space), which proxies to localhost:8000. Publishing on all
    # addresses exposed the API directly on the internet, bypassing TLS.
    # Both families, because the host's `localhost` resolves to ::1 first.
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ai-calculator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React приложение
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-server-calculator-frontend
    # Loopback only, as for the backend: the host's nginx on 443 proxies
    # to localhost:3000.
    ports:
      - "127.0.0.1:3000:80"
      - "[::1]:3000:80"
    environment:
      # nginx inside the container reverse-proxies /v1/*, /mcp, /healthz, /docs,
      # /redoc, and /openapi.json to this URL. Point at the backend service
      # by its compose-network hostname so the browser only ever hits
      # http://localhost:3000 (UI + REST + Swagger on one port).
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-calculator-network
    restart: unless-stopped

networks:
  ai-calculator-network:
    driver: bridge

volumes:
  # Опционально: для персистентного хранения данных
  backend_data:
